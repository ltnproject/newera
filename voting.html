<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Era – Lunch Vote</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --glass-bg: rgba(255,255,255,0.12);
      --glass-border: rgba(255,255,255,0.22);
      --glass-blur: 18px;
      --accent: #f5c842;
      --accent2: #ff7043;
      --text: #fff;
      --text-sub: rgba(255,255,255,0.7);
      --card-radius: 20px;
    }
    body {
      min-height: 100vh;
      font-family: 'Sarabun', 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a0533 0%, #2d1b69 35%, #0d3b6e 70%, #0a2a4a 100%);
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.35; pointer-events: none; z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #7c3aed, transparent 70%);
      top: -150px; left: -150px;
    }
    body::after {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #f5c842, transparent 70%);
      bottom: -100px; right: -100px;
    }
    header {
      position: relative; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 24px 32px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
    }
    header img { height: 48px; object-fit: contain; }
    header .brand { display: flex; flex-direction: column; }
    header .brand .name { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.04em; }
    header .brand .sub { font-size: 0.78rem; color: var(--text-sub); letter-spacing: 0.08em; }
    main {
      position: relative; z-index: 5;
      max-width: 680px; margin: 0 auto;
      padding: 48px 20px 80px;
    }
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
    }
    .title-card {
      padding: 32px 28px 24px;
      margin-bottom: 24px;
      text-align: center;
    }
    .week-label {
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 10px;
    }
    .title-card h1 { font-size: 1.9rem; font-weight: 700; line-height: 1.2; margin-bottom: 6px; }
    .title-card p { font-size: 0.9rem; color: var(--text-sub); }
    .vote-card { padding: 28px; margin-bottom: 20px; }
    .field-label {
      font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 10px; display: block;
    }
    .name-input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 12px 16px;
      color: #fff; font-family: inherit; font-size: 1rem;
      outline: none; transition: border-color 0.2s, background 0.2s;
      margin-bottom: 24px;
    }
    .name-input::placeholder { color: rgba(255,255,255,0.35); }
    .name-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.13); }
    .options-label {
      font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 14px; display: block;
    }
    .option-list { display: flex; flex-direction: column; gap: 10px; }
    .option-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px; border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      cursor: pointer; transition: border-color 0.18s, background 0.18s, transform 0.12s;
      user-select: none;
    }
    .option-item:hover { border-color: rgba(245,200,66,0.5); background: rgba(245,200,66,0.08); transform: translateX(3px); }
    .option-item.selected { border-color: var(--accent); background: rgba(245,200,66,0.15); }
    .option-item input[type="radio"] { display: none; }
    .radio-circle {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.18s;
    }
    .option-item.selected .radio-circle { border-color: var(--accent); }
    .radio-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); opacity: 0; transform: scale(0.5);
      transition: opacity 0.18s, transform 0.18s;
    }
    .option-item.selected .radio-dot { opacity: 1; transform: scale(1); }
    .option-names { display: flex; flex-direction: column; }
    .option-en { font-size: 0.98rem; font-weight: 600; }
    .option-th { font-size: 0.78rem; color: var(--text-sub); }
    .submit-btn {
      width: 100%; margin-top: 26px; padding: 16px;
      border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #1a0533; font-family: inherit;
      font-size: 1rem; font-weight: 700; letter-spacing: 0.06em;
      cursor: pointer; transition: opacity 0.2s, transform 0.12s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(245,200,66,0.3);
    }
    .submit-btn:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 8px 32px rgba(245,200,66,0.4); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status-msg {
      text-align: center; margin-top: 14px;
      font-size: 0.88rem; min-height: 22px;
      color: var(--accent); transition: opacity 0.3s;
    }
    .status-msg.error { color: #ff7043; }
    .success-banner {
      display: none; padding: 28px;
      text-align: center;
    }
    .success-banner .emoji { font-size: 3rem; margin-bottom: 12px; }
    .success-banner h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    .success-banner p { color: var(--text-sub); font-size: 0.9rem; }
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--accent); color: #1a0533;
      padding: 12px 24px; border-radius: 12px;
      font-weight: 700; font-size: 0.9rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.35s cubic-bezier(.4,0,.2,1), opacity 0.35s;
      opacity: 0; z-index: 999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    @media (max-width: 480px) {
      header { padding: 16px 18px; }
      main { padding: 28px 14px 60px; }
      .title-card h1 { font-size: 1.4rem; }
      .vote-card { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<header>
  <img src="https://drk.qzz.io/newera/logo.png" alt="New Era Logo" onerror="this.style.display='none'" />
  <div class="brand">
    <span class="name">NEW ERA</span>
    <span class="sub">LUNCH VOTING · โหวตเมนูกลางวัน</span>
  </div>
</header>

<main>
  <div class="glass-card title-card">
    <div class="week-label">This Week · สัปดาห์นี้</div>
    <h1>🍽 โหวตเมนูกลางวัน<br/><span style="font-size:1.2rem;font-weight:400;color:rgba(255,255,255,0.75)">What are we eating?</span></h1>
    <p>เลือก 1 เมนูที่อยากกิน · Pick your favourite lunch</p>
  </div>

  <div class="glass-card vote-card" id="voteSection">
    <label class="field-label" for="voterName">ชื่อของคุณ / Your Name</label>
    <input class="name-input" id="voterName" type="text" placeholder="กรอกชื่อ / Enter your name" maxlength="40" />
    <span class="options-label">เมนู / Options</span>
    <div class="option-list" id="optionList"></div>
    <button class="submit-btn" id="submitBtn" onclick="submitVote()">
      ✅ ส่งโหวต · Submit Vote
    </button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="glass-card success-banner" id="successBanner">
    <div class="emoji">🎉</div>
    <h2>โหวตสำเร็จแล้ว! · Vote Submitted!</h2>
    <p id="successText">ขอบคุณที่ร่วมโหวต · Thanks for voting</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBqMo574RMGOwE3HKo4sek6vdmSvjcU06M",
    authDomain: "neweraproject-by-jacob.firebaseapp.com",
    databaseURL: "https://neweraproject-by-jacob-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "neweraproject-by-jacob",
    storageBucket: "neweraproject-by-jacob.firebasestorage.app",
    messagingSenderId: "318348962332",
    appId: "1:318348962332:web:49f2844becc47647be8dd9",
    measurementId: "G-RNHTC555T9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const MENUS = [
    { en: "Spaghetti Carbonara", th: "สปาเก็ตตี้คาร์โบนาร่า" },
    { en: "Ramen", th: "ราเมง" },
    { en: "Pad Thai", th: "ผัดไทย" },
    { en: "Lasagne", th: "ลาซานญ่า" },
    { en: "Fish & Chips", th: "ปลาทอดเฟรนช์ฟราย" },
    { en: "American Fried Rice", th: "ข้าวผัดอเมริกัน" },
    { en: "Papaya Salad with Sticky Rice & Fried Chicken", th: "ตำ+ข้าวเหนียวไก่ทอด" },
    { en: "Chicken Teriyaki", th: "ไก่เทริยากิ" },
  ];

  const optionList = document.getElementById('optionList');
  let selectedOption = null;

  MENUS.forEach((m, i) => {
    const div = document.createElement('label');
    div.className = 'option-item';
    div.innerHTML = `
      <input type="radio" name="menu" value="${i}" />
      <div class="radio-circle"><div class="radio-dot"></div></div>
      <div class="option-names">
        <span class="option-en">${m.en}</span>
        <span class="option-th">${m.th}</span>
      </div>`;
    div.addEventListener('click', () => {
      document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
      selectedOption = i;
    });
    optionList.appendChild(div);
  });

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.submitVote = async function() {
    const name = document.getElementById('voterName').value.trim();
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('statusMsg');

    if (!name) { showStatus('กรุณากรอกชื่อก่อน · Please enter your name', true); return; }
    if (selectedOption === null) { showStatus('กรุณาเลือกเมนู · Please pick a menu', true); return; }

    btn.disabled = true;
    showStatus('กำลังส่ง… · Submitting…');

    const votesRef = ref(db, 'lunchvote/votes');
    const snap = await get(votesRef);
    const existing = snap.val() || {};
    const alreadyVoted = Object.values(existing).find(v => v.name?.toLowerCase() === name.toLowerCase());

    if (alreadyVoted) {
      showStatus('คุณโหวตไปแล้ว · You already voted!', true);
      btn.disabled = false;
      return;
    }

    const key = name.replace(/[^a-zA-Z0-9ก-๙]/g, '_').substring(0, 30) + '_' + Date.now();
    await set(ref(db, `lunchvote/votes/${key}`), {
      name,
      choice: selectedOption,
      timestamp: Date.now()
    });

    document.getElementById('voteSection').style.display = 'none';
    const banner = document.getElementById('successBanner');
    banner.style.display = 'block';
    document.getElementById('successText').textContent =
      `คุณเลือก: ${MENUS[selectedOption].th} (${MENUS[selectedOption].en}) · ขอบคุณที่ร่วมโหวต!`;
  };

  function showStatus(msg, isError = false) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg' + (isError ? ' error' : '');
  }
</script>
</body>
</html>
