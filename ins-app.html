<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Era</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "Segoe UI", sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    background:
    radial-gradient(circle at top, #2563eb, transparent 40%),
    linear-gradient(135deg,#020617,#0f172a);

    color:white;
}


.container {

    width:90%;
    max-width:450px;

    padding:40px 30px;

    text-align:center;

    background:
    rgba(255,255,255,.09);

    backdrop-filter:blur(25px);

    border:
    1px solid rgba(255,255,255,.15);

    border-radius:32px;

    box-shadow:
    0 30px 80px rgba(0,0,0,.5);

}


.logo {

    width:110px;
    height:110px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:28px;

    font-size:42px;
    font-weight:900;

    background:
    linear-gradient(135deg,#3b82f6,#06b6d4);

    box-shadow:
    0 15px 40px rgba(37,99,235,.5);

}


h1 {

    margin-top:25px;

    font-size:34px;

}


.subtitle {

    margin-top:8px;

    color:#cbd5e1;

}


.badges {

    display:flex;

    justify-content:center;

    gap:10px;

    margin:25px 0;

}


.badge {

    padding:8px 14px;

    border-radius:999px;

    background:
    rgba(255,255,255,.12);

    font-size:13px;

}



.text {

    color:#dbeafe;

    line-height:1.6;

    margin-bottom:25px;

}


.button {

    display:block;

    padding:17px;

    margin-top:15px;

    border-radius:18px;

    text-decoration:none;

    color:white;

    font-size:17px;

    font-weight:700;

    transition:.2s;

}


.app {

    background:
    linear-gradient(135deg,#2563eb,#06b6d4);

    box-shadow:
    0 12px 30px rgba(6,182,212,.35);

}



.dns {

    background:
    rgba(255,255,255,.12);

    border:
    1px solid rgba(255,255,255,.2);

}



.button:hover {

    transform:translateY(-3px);

}



.info {

    margin-top:25px;

    padding:15px;

    border-radius:18px;

    background:
    rgba(0,0,0,.25);

    color:#94a3b8;

    font-size:14px;

}


.footer {

    margin-top:25px;

    color:#64748b;

    font-size:13px;

}

</style>

</head>


<body>


<div class="container">


<div class="logo">
NE
</div>


<h1>
New Era
</h1>


<div class="subtitle">
Official Services
</div>



<div class="badges">

<div class="badge">
📱 iOS
</div>

<div class="badge">
⚡ iPadOS
</div>

<div class="badge">
✅ Ready
</div>

</div>



<div class="text">

Install New Era Admin or configure
New Era DNS directly on your Apple device.

</div>



<a class="button app"

href="itms-services://?action=download-manifest&url=https://drk.qzz.io/newera/manifest.plist">

📲 Install New Era Admin

</a>



<a class="button dns"

href="https://raw.githubusercontent.com/ltnproject/newera/main/dns/dnsprofile.mobileconfig">

🌐 Install New Era DNS

</a>




<div class="info">

Open this page in Safari on iPhone/iPad.

<br><br>

For DNS profile:
<br>
Settings → Profile Downloaded → Install

</div>



<div class="footer">

© 2026 New Era

</div>


</div>


</body>
</html>
