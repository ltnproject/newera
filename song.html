<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Era Song Voting</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
}

.header{
    text-align:center;
    padding:40px 30px;
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
}

.logo{
    width:220px;
    max-width:90%;
    margin-bottom:20px;
}

.header h1{
    font-size:2.5rem;
    margin-bottom:10px;
}

.header p{
    opacity:0.95;
    font-size:1.1rem;
}

.info{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
    padding:25px;
    background:#f8fafc;
}

.info-box{
    background:white;
    border-radius:20px;
    padding:18px 25px;
    min-width:180px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.info-box h3{
    color:#2563eb;
    margin-bottom:5px;
}

.info-box p{
    color:#64748b;
    font-size:14px;
}

.form-section{
    padding:25px;
}

iframe{
    width:100%;
    height:950px;
    border:none;
    border-radius:20px;
}

.footer{
    text-align:center;
    padding:20px;
    background:#f8fafc;
    color:#64748b;
}

@media(max-width:768px){

.header h1{
    font-size:2rem;
}

.logo{
    width:180px;
}

iframe{
    height:1200px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<img
src="https://drk.qzz.io/newera/logo.png"
alt="New Era Logo"
class="logo">

<h1>New Era Song Voting</h1>

<p>
Help us choose songs.
Every vote matters.
</p>

</div>

<div class="info">

<div class="info-box">
<h3>🎶 Vote</h3>
<p>Choose your favorite song option</p>
</div>

<div class="info-box">
<h3>💡 Suggest</h3>
<p>Share new songs ideas</p>
</div>

<div class="info-box">
<h3>📊 Results</h3>
<p>Responses are collected automatically</p>
</div>

</div>

<div class="form-section">

<iframe
src="https://docs.google.com/forms/d/e/1FAIpQLSc7Ie7il6z4XVK4IMgvbp3idNZNqZuBSerBS0gVnBGSiUmSWQ/viewform?embedded=true">
Loading...
</iframe>

</div>

<div class="footer">
<p>
© 2026 New Era Student Council • Building a Better School Together
</p>
</div>

</div>

</div>

</body>
</html>
